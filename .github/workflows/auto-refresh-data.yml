name: Tự động đồng bộ dữ liệu GDP

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vmest-auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tải lại các nguồn máy đọc được
        env:
          VMEST_AUTO_REFRESH: '1'
        run: |
          node refresh_data.mjs
          node build_extended_data.mjs
          node refresh_expanded_data.mjs

      - name: Kiểm tra có dữ liệu nguồn thay đổi không
        id: source-change
        shell: bash
        run: |
          changed_files="$(git status --porcelain -- data | grep -E '\\.(csv|xlsx|xls)$' || true)"
          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Các đầu vào nguồn đã thay đổi:"
            echo "$changed_files"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git restore -- data refresh_manifest.json
            echo "Không có quan sát nguồn mới; bỏ qua tái tính toán và không tạo commit."
          fi

      - name: Cài thư viện phân tích
        if: steps.source-change.outputs.changed == 'true'
        run: python -m pip install -r requirements-analysis.txt

      - name: Tính lại phân tích, dự báo và dashboard
        if: steps.source-change.outputs.changed == 'true'
        run: |
          python scripts/analyze_observed_data.py
          python scripts/analyze_expanded_data.py
          python scripts/validate_auto_refresh.py
          python scripts/record_auto_refresh.py
          python scripts/snapshot_data.py
          python scripts/build_dashboard.py

      - name: Lưu phiên bản dữ liệu và kích hoạt Render
        if: steps.source-change.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi cần lưu."
            exit 0
          fi
          git commit -m "Tự động cập nhật dữ liệu nguồn GDP"
          git push
