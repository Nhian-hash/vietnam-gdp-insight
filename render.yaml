services:
  - type: web
    name: vietnam-gdp-insight-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: https://nhian-hash.github.io
